name: CI Build & Test

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - 'art/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - 'art/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Keystore from Secret (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > app/ci-keystore.jks
            test -s app/ci-keystore.jks
            echo "KEYSTORE_PATH=ci-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 not configured; Release APK will use debug signing."
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APK Artifacts
        run: |
          mkdir -p apks/debug apks/release
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} apks/debug/OfficeAdalKeyIsolator-debug.apk \;
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} apks/release/OfficeAdalKeyIsolator-release.apk \;
          test -s apks/debug/OfficeAdalKeyIsolator-debug.apk
          test -s apks/release/OfficeAdalKeyIsolator-release.apk
          ls -la apks/debug/ apks/release/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeAdalKeyIsolator-debug
          path: apks/debug/OfficeAdalKeyIsolator-debug.apk
          retention-days: 7

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeAdalKeyIsolator-release
          path: apks/release/OfficeAdalKeyIsolator-release.apk
          retention-days: 7

      - name: Prune Old Artifacts on Success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate --jq ".artifacts[] | select(.workflow_run.id != $CURRENT_RUN_ID) | .id" | while read -r art_id; do
            if [ -n "$art_id" ]; then
              echo "Pruning older artifact: $art_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" || true
            fi
          done

      - name: Clean up Sensitive Files
        if: always()
        run: |
          rm -f app/ci-keystore.jks
          rm -rf apks/
